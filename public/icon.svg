<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Logo Mark: Stylized 'C' with Connectivity Node & Pin -->
  <g filter="url(#shadow)">
    <!-- Main sweeping C arc -->
    <path d="M 330 145 C 290 115, 210 115, 170 155 C 115 210, 115 300, 170 355 C 215 400, 290 400, 335 365" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="48" 
          stroke-linecap="round"/>

    <!-- Shopping bag / marketplace connection pulse inside -->
    <circle cx="340" cy="155" r="26" fill="#34d399"/>
    <circle cx="345" cy="360" r="26" fill="#fbbf24"/>

    <!-- Central pin node -->
    <path d="M 256 210 C 235 210, 218 227, 218 248 C 218 275, 256 315, 256 315 C 256 315, 294 275, 294 248 C 294 227, 277 210, 256 210 Z" fill="#ffffff"/>
    <circle cx="256" cy="246" r="12" fill="#059669"/>
  </g>
</svg>
